[project]
name = "blom"
version = "0.1.0"
description = "Blom-ICT-1.0: model and training code"
requires-python = ">=3.13"
dependencies = ["numpy>=2", "torch==2.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/blom"]

[dependency-groups]
dev = ["hypothesis", "pyright", "pytest", "ruff"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "NPY", "PERF"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["slow: ...", "gpu: ..."]

[tool.pyright]
include = ["python", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"