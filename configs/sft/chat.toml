# Fine-tuning on chat data (python -m blom.sft). The model comes from --init,
# so only a [train] table is needed. seq_len must not exceed the model's max_seq.
[train]
batch_size = 8
grad_accum = 8
seq_len = 1024
peak_lr = 5e-5
min_lr = 5e-6
warmup_steps = 100
decay_steps = 2000
total_steps = 3000
weight_decay = 0.1
max_grad_norm = 1.0
eval_every = 250
eval_batches = 25
checkpoint_every = 250
log_every = 10
seed = 0